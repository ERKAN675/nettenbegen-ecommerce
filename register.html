<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kayıt Ol | Nettenbegen</title>
  <link rel="icon" type="image/png" href="nettenbegen.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { width: 100%; max-width: 460px; background: #fff; border-radius: 18px; box-shadow: 0 15px 35px rgba(0,0,0,0.15); padding: 28px; }
    .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .logo img { height: 32px; }
    h1 { margin: 0 0 8px; font-size: 1.6rem; }
    p { margin: 0 0 18px; color: #666; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input { width: 100%; padding: 12px 14px; border: 2px solid #e7e7e7; border-radius: 10px; font-size: 1rem; outline: none; transition: border-color .2s; }
    input:focus { border-color: #4facfe; }
    .actions { display: flex; align-items: center; justify-content: flex-end; margin-top: 6px; }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 16px; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; }
    .btn-primary { background: #4facfe; color: #fff; }
    .btn-primary:hover { background: #3d9bfe; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <img src="nettenbegen.png" alt="Nettenbegen">
      <strong>Nettenbegen</strong>
    </div>
    <h1>Kayıt Ol</h1>
    <p>Hızlıca hesabını oluştur.</p>
    <form onsubmit="return submitRegisterPage(event)">
      <div class="form-group">
        <label for="name">Ad Soyad</label>
        <input type="text" id="name" required placeholder="Adınız Soyadınız" />
      </div>
      <div class="form-group">
        <label for="email">E-posta</label>
        <input type="email" id="email" required placeholder="ornek@mail.com" />
      </div>
      <div class="form-group">
        <label for="phone">Telefon Numarası</label>
        <input type="tel" id="phone" required placeholder="+90 5XX XXX XX XX" pattern="^\+90\s*\d{10}$" />
      </div>
      <div class="form-group">
        <label for="password">Şifre</label>
        <input type="password" id="password" required placeholder="••••••••" />
      </div>
      <div class="form-group">
        <label for="password2">Şifre (Tekrar)</label>
        <input type="password" id="password2" required placeholder="••••••••" />
      </div>
      <div class="actions">
        <button class="btn btn-primary" type="submit"><i class="fas fa-user-plus"></i> Kayıt Ol</button>
      </div>
    </form>
  </div>

  <script>
    function submitRegisterPage(e) {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const p1 = document.getElementById('password').value.trim();
      const p2 = document.getElementById('password2').value.trim();
      if (!name || !email || !phone || !p1 || !p2) { alert('Lütfen tüm alanları doldurun.'); return false; }
      // Telefon doğrulaması: +90 ile başlayıp 10 hane olmalı
      const normalized = phone.replace(/[()\-\s]/g, '');
      if (!/^\+90\d{10}$/.test(normalized)) {
        alert('Lütfen +90 ile başlayan ve 10 haneli bir telefon numarası girin.');
        return false;
      }
      if (p1 !== p2) { alert('Şifreler eşleşmiyor!'); return false; }
      alert('Kayıt başarılı!');
      window.location.href = 'index.html';
      return false;
    }
  </script>
</body>
</html>
