<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giriş Yap | Nettenbegen</title>
  <link rel="icon" type="image/png" href="nettenbegen.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { width: 100%; max-width: 420px; background: #fff; border-radius: 18px; box-shadow: 0 15px 35px rgba(0,0,0,0.15); padding: 28px; }
    .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .logo img { height: 32px; }
    h1 { margin: 0 0 8px; font-size: 1.6rem; }
    p { margin: 0 0 18px; color: #666; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input { width: 100%; padding: 12px 14px; border: 2px solid #e7e7e7; border-radius: 10px; font-size: 1rem; outline: none; transition: border-color .2s; }
    input:focus { border-color: #4facfe; }
    .actions { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 16px; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; }
    .btn-primary { background: #4facfe; color: #fff; }
    .btn-primary:hover { background: #3d9bfe; }
    .links { margin-top: 14px; display: flex; justify-content: space-between; font-size: 0.95rem; }
    .links a { color: #4facfe; text-decoration: none; }
    .links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <img src="nettenbegen.png" alt="Nettenbegen">
      <strong>Nettenbegen</strong>
    </div>
    <h1>Giriş Yap</h1>
    <p>Hesabınıza giriş yaparak alışverişe devam edin.</p>
    <form onsubmit="return submitLoginPage(event)">
      <div class="form-group">
        <label for="email">E-posta</label>
        <input type="email" id="email" required placeholder="ornek@mail.com" />
      </div>
      <div class="form-group">
        <label for="password">Şifre</label>
        <input type="password" id="password" required placeholder="••••••••" />
      </div>
      <div class="actions">
        <a href="#" onclick="forgotFromLogin(); return false;">Şifremi unuttum</a>
        <button class="btn btn-primary" type="submit"><i class="fas fa-sign-in-alt"></i> Giriş Yap</button>
      </div>
      <div class="links">
        <span>Hesabın yok mu?</span>
        <a href="index.html#register">Kayıt Ol</a>
      </div>
    </form>
  </div>

  <script>
    function submitLoginPage(e) {
      e.preventDefault();
      // Basit kontrol
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      if (!email || !password) return false;
      // Basit bir "giriş başarılı" simülasyonu
      alert('Giriş başarılı!');
      // Ana sayfaya dön
      window.location.href = 'index.html';
      return false;
    }
    function forgotFromLogin() {
      alert('Şifre sıfırlama bağlantısı e-posta adresinize gönderilecek.');
    }
  </script>
</body>
</html>
